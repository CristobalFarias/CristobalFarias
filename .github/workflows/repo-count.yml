name: Contador de repositorios

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular estadísticas de repos
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: python .github/scripts/repo_stats.py README.md

      - name: Guardar cambios
        run: |
          git diff --quiet && { echo "Sin cambios"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: actualiza contador de repositorios"
          git push
